name: Gra - build na zadanie

# Client exports consume Actions minutes only when explicitly dispatched.
# Server deployment is a separate manual workflow selected in the panel.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Panel task UUID
        required: true
        type: string
      build_id:
        description: Panel build UUID (idempotency key)
        required: true
        type: string
      commit_sha:
        description: Full pushed commit SHA to export
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: game-${{ github.event_name }}-${{ inputs.build_id || github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_DOTTED: 4.7.2.stable

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TASK_ID: ${{ inputs.task_id }}
      BUILD_ID: ${{ inputs.build_id }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Sprawdz zlecenie
        id: validate
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          node <<'NODE'
          const uuid = /^[a-f0-9-]{36}$/;
          if (!uuid.test(process.env.TASK_ID) || !uuid.test(process.env.BUILD_ID) ||
              !/^[a-f0-9]{40}$/.test(process.env.COMMIT_SHA) || (process.env.CI_TOKEN || '').length < 32) {
            throw new Error('Invalid panel inputs or missing CI_TOKEN. No export started.');
          }
          NODE

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Zglos rozpoczecie do panelu
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          node <<'NODE'
          const body = { taskId: process.env.TASK_ID, buildId: process.env.BUILD_ID,
            commit: process.env.COMMIT_SHA, status: 'running', result: 'Budowanie Windows i macOS.',
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` };
          (async () => {
            const response = await fetch('https://giera-panel.vercel.app/api/ci/builds', {
              method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.CI_TOKEN}` },
              body: JSON.stringify(body), signal: AbortSignal.timeout(15000), redirect: 'error' });
            if (!response.ok) throw new Error(`Panel HTTP ${response.status}. No export started.`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Pamięć podręczna Godota
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-download
          key: godot-${{ env.GODOT_VERSION }}

      - name: Pobierz Godota i szablony eksportu
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-download
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o ~/godot-download/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o ~/godot-download/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"

      - name: Zainstaluj Godota
        run: |
          unzip -q -o ~/godot-download/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          templates=~/.local/share/godot/export_templates/${GODOT_DOTTED}
          mkdir -p "$templates"
          unzip -q -o ~/godot-download/templates.tpz -d ~/templates
          cp ~/templates/templates/* "$templates/"

      - name: Zaimportuj zasoby
        run: ~/godot/godot --headless --path . --import

      - name: Zbuduj wersję na Windows
        run: |
          mkdir -p export/windows
          ~/godot/godot --headless --path . --export-release "Windows" export/windows/CorpWars.exe
          test -s export/windows/CorpWars.exe

      - name: Zbuduj wersję na macOS
        run: |
          mkdir -p export/macos
          ~/godot/godot --headless --path . --export-release "macOS" export/macos/CorpWars.zip
          test -s export/macos/CorpWars.zip

      - name: Przygotuj pliki
        run: |
          mkdir -p dist
          mv export/windows/CorpWars.exe dist/CorpWars-windows.exe
          mv export/macos/CorpWars.zip dist/CorpWars-macos.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CorpWars
          path: dist/*
          compression-level: 0

      # Every panel build is its own test release, which launcher 0.2.0+ lists for picking, and
      # it also becomes the "najnowsza" test channel that every launcher follows.
      - name: Opublikuj wersje zadania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const VERSION := "\(.*\)"/\1/p' scripts/core/c.gd)
          subject=$(git log -1 --format=%s | cut -c1-70)
          title="Test ${version} · ${COMMIT_SHA:0:7} · ${subject}"
          notes="Build testowy z panelu. Task: ${TASK_ID}. Commit: ${COMMIT_SHA}."
          gh release create "panel-${BUILD_ID}" dist/* --prerelease --title "$title" --target "$COMMIT_SHA" --notes "$notes"
          gh release view "panel-${BUILD_ID}" --json url,assets > "$RUNNER_TEMP/panel-release.json"

      - name: Przestaw kanał testowy najnowsza
        # The build itself is already published above; a hiccup here must not report it as failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const VERSION := "\(.*\)"/\1/p' scripts/core/c.gd)
          subject=$(git log -1 --format=%s | cut -c1-70)
          if ! gh release view najnowsza >/dev/null 2>&1; then
            gh release create najnowsza --prerelease --target "$COMMIT_SHA" --title "Najnowszy build" --notes "Kanał testowy launchera."
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/najnowsza" -f sha="$COMMIT_SHA" -F force=true >/dev/null
          gh release upload najnowsza dist/* --clobber
          # Old package names would shadow the new ones in launchers that take the first match.
          for old in MieczDawida-windows.exe MieczDawida-macos.zip; do
            gh release delete-asset najnowsza "$old" -y 2>/dev/null || true
          done
          gh release edit najnowsza --prerelease --title "Najnowszy build · ${version} · ${COMMIT_SHA:0:7} · ${subject}" \
            --notes "Kanał testowy launchera: zawsze ostatni build zlecony z panelu. Task: ${TASK_ID}. Commit: ${COMMIT_SHA}."

      - name: Zglos wynik do panelu
        if: always() && steps.validate.outcome == 'success'
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ok = process.env.BUILD_STATUS === 'success';
          const release = ok ? JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/panel-release.json`, 'utf8')) : null;
          const body = { taskId: process.env.TASK_ID, buildId: process.env.BUILD_ID,
            commit: process.env.COMMIT_SHA, status: ok ? 'succeeded' : 'failed',
            result: ok ? 'Wersja Windows i macOS gotowa do pobrania.' : 'Build nie powiodl sie. Sprawdz logi GitHuba.',
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ...(release ? { releaseUrl: release.url, downloads: release.assets.map(file => ({ name: file.name, url: file.url })) } : {}) };
          (async () => {
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const response = await fetch('https://giera-panel.vercel.app/api/ci/builds', {
                  method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.CI_TOKEN}` },
                  body: JSON.stringify(body), signal: AbortSignal.timeout(15000), redirect: 'error' });
                if (response.ok) return;
                throw new Error(`Panel HTTP ${response.status}`);
              } catch (error) { if (attempt === 2) throw error; }
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
