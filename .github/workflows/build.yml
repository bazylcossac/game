name: Buildy

# Builds the game for Windows and macOS on every push to main and on tags like v0.10.0.
# The files land on the Releases page: "najnowsza" always holds the last build of main.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_DOTTED: 4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pamięć podręczna Godota
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-download
          key: godot-${{ env.GODOT_VERSION }}

      - name: Pobierz Godota i szablony eksportu
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-download
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o ~/godot-download/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o ~/godot-download/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"

      - name: Zainstaluj Godota
        run: |
          unzip -q -o ~/godot-download/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          templates=~/.local/share/godot/export_templates/${GODOT_DOTTED}
          mkdir -p "$templates"
          unzip -q -o ~/godot-download/templates.tpz -d ~/templates
          cp ~/templates/templates/* "$templates/"

      - name: Zaimportuj zasoby
        run: ~/godot/godot --headless --path . --import

      - name: Zbuduj wersję na Windows
        run: |
          mkdir -p export/windows
          ~/godot/godot --headless --path . --export-release "Windows" export/windows/MieczDawida.exe
          test -s export/windows/MieczDawida.exe

      - name: Zbuduj wersję na macOS
        run: |
          mkdir -p export/macos
          ~/godot/godot --headless --path . --export-release "macOS" export/macos/MieczDawida.zip
          test -s export/macos/MieczDawida.zip

      - name: Przygotuj pliki
        run: |
          mkdir -p dist
          mv export/windows/MieczDawida.exe dist/MieczDawida-windows.exe
          mv export/macos/MieczDawida.zip dist/MieczDawida-macos.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MieczDawida
          path: dist/*
          compression-level: 0

      - name: Opublikuj najnowszy build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete najnowsza --cleanup-tag --yes || true
          gh release create najnowsza dist/* --prerelease --title "Najnowszy build" --target "${GITHUB_SHA}" --notes "Automatyczny build z commita ${GITHUB_SHA}."

      - name: Opublikuj wydanie
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes

  # After a good build of main, the dedicated server on the VPS gets the same commit, so the
  # "najnowsza" download and the server always run the same version. Needs the repository
  # secrets VPS_HOST, VPS_SSH_KEY (a key only for this) and VPS_KNOWN_HOSTS (the server's host key).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Spakuj serwer
        run: |
          mkdir -p paczka_vps
          tar -czf paczka_vps/miecz-dawida-serwer.tar.gz project.godot main.tscn scripts shaders assets
          cp deploy/install.sh deploy/miecz-dawida.service deploy/miecz-dawida.env paczka_vps/
          ls -la paczka_vps

      - name: Klucz SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n' "$VPS_HOST" > ~/.ssh/config

      - name: Wgraj i zainstaluj na VPS
        run: |
          dir="/root/miecz-deploy/${GITHUB_SHA}"
          ssh vps "mkdir -p '$dir'"
          scp -q paczka_vps/* "vps:$dir/"
          # The install keeps going even if this run is cancelled, and one runs at a time.
          ssh vps "cd '$dir' && nohup flock /root/miecz-deploy.lock env DEBIAN_FRONTEND=noninteractive bash install.sh > '$dir/install.log' 2>&1 < /dev/null & echo \$! > '$dir/pid'"
          for i in $(seq 1 120); do
            sleep 10
            if ssh vps "grep -q '^Gotowe' '$dir/install.log' || ! kill -0 \$(cat '$dir/pid') 2> /dev/null"; then
              break
            fi
          done
          ssh vps "tail -n 25 '$dir/install.log'"
          ssh vps "grep -q '^Gotowe' '$dir/install.log'"

      - name: Sprawdź serwer
        run: |
          sleep 5
          ssh vps "systemctl is-active miecz-dawida && journalctl -u miecz-dawida -n 6 --no-pager"
          # Keep the last three uploads, for a look at their install logs.
          ssh vps "ls -1dt /root/miecz-deploy/*/ | tail -n +4 | xargs -r rm -rf"
