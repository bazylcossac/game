name: Gra - build na zadanie i deploy VPS

# Client exports consume Actions minutes only when explicitly dispatched.
# A push to main keeps the existing VPS deployment, without exporting clients.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task_id:
        description: Panel task UUID
        required: true
        type: string
      build_id:
        description: Panel build UUID (idempotency key)
        required: true
        type: string
      commit_sha:
        description: Full pushed commit SHA to export
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: game-${{ github.event_name }}-${{ inputs.build_id || github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_DOTTED: 4.7.2.stable

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TASK_ID: ${{ inputs.task_id }}
      BUILD_ID: ${{ inputs.build_id }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Sprawdz zlecenie
        id: validate
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          node <<'NODE'
          const uuid = /^[a-f0-9-]{36}$/;
          if (!uuid.test(process.env.TASK_ID) || !uuid.test(process.env.BUILD_ID) ||
              !/^[a-f0-9]{40}$/.test(process.env.COMMIT_SHA) || (process.env.CI_TOKEN || '').length < 32) {
            throw new Error('Invalid panel inputs or missing CI_TOKEN. No export started.');
          }
          NODE

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Zglos rozpoczecie do panelu
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          node <<'NODE'
          const body = { taskId: process.env.TASK_ID, buildId: process.env.BUILD_ID,
            commit: process.env.COMMIT_SHA, status: 'running', result: 'Budowanie Windows i macOS.',
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` };
          (async () => {
            const response = await fetch('https://giera-panel.vercel.app/api/ci/builds', {
              method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.CI_TOKEN}` },
              body: JSON.stringify(body), signal: AbortSignal.timeout(15000), redirect: 'error' });
            if (!response.ok) throw new Error(`Panel HTTP ${response.status}. No export started.`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Pamięć podręczna Godota
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-download
          key: godot-${{ env.GODOT_VERSION }}

      - name: Pobierz Godota i szablony eksportu
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-download
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o ~/godot-download/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o ~/godot-download/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"

      - name: Zainstaluj Godota
        run: |
          unzip -q -o ~/godot-download/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          templates=~/.local/share/godot/export_templates/${GODOT_DOTTED}
          mkdir -p "$templates"
          unzip -q -o ~/godot-download/templates.tpz -d ~/templates
          cp ~/templates/templates/* "$templates/"

      - name: Zaimportuj zasoby
        run: ~/godot/godot --headless --path . --import

      - name: Zbuduj wersję na Windows
        run: |
          mkdir -p export/windows
          ~/godot/godot --headless --path . --export-release "Windows" export/windows/MieczDawida.exe
          test -s export/windows/MieczDawida.exe

      - name: Zbuduj wersję na macOS
        run: |
          mkdir -p export/macos
          ~/godot/godot --headless --path . --export-release "macOS" export/macos/MieczDawida.zip
          test -s export/macos/MieczDawida.zip

      - name: Przygotuj pliki
        run: |
          mkdir -p dist
          mv export/windows/MieczDawida.exe dist/MieczDawida-windows.exe
          mv export/macos/MieczDawida.zip dist/MieczDawida-macos.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MieczDawida
          path: dist/*
          compression-level: 0

      - name: Opublikuj wersje zadania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "panel-${BUILD_ID}" dist/* --prerelease --title "Build ${COMMIT_SHA:0:7}" --target "$COMMIT_SHA" --notes "Build na zadanie z panelu. Task: ${TASK_ID}. Commit: ${COMMIT_SHA}."
          gh release view "panel-${BUILD_ID}" --json url,assets > "$RUNNER_TEMP/panel-release.json"

      - name: Zglos wynik do panelu
        if: always() && steps.validate.outcome == 'success'
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ok = process.env.BUILD_STATUS === 'success';
          const release = ok ? JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/panel-release.json`, 'utf8')) : null;
          const body = { taskId: process.env.TASK_ID, buildId: process.env.BUILD_ID,
            commit: process.env.COMMIT_SHA, status: ok ? 'succeeded' : 'failed',
            result: ok ? 'Wersja Windows i macOS gotowa do pobrania.' : 'Build nie powiodl sie. Sprawdz logi GitHuba.',
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ...(release ? { releaseUrl: release.url, downloads: release.assets.map(file => ({ name: file.name, url: file.url })) } : {}) };
          (async () => {
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const response = await fetch('https://giera-panel.vercel.app/api/ci/builds', {
                  method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${process.env.CI_TOKEN}` },
                  body: JSON.stringify(body), signal: AbortSignal.timeout(15000), redirect: 'error' });
                if (response.ok) return;
                throw new Error(`Panel HTTP ${response.status}`);
              } catch (error) { if (attempt === 2) throw error; }
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

  # Existing source-based VPS deployment. Independent from optional client exports.
  # Needs VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS repository secrets.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Spakuj serwer
        run: |
          mkdir -p paczka_vps
          tar -czf paczka_vps/miecz-dawida-serwer.tar.gz project.godot main.tscn scripts shaders assets
          cp deploy/install.sh deploy/miecz-dawida.service deploy/miecz-dawida.env paczka_vps/
          ls -la paczka_vps

      - name: Klucz SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n' "$VPS_HOST" > ~/.ssh/config

      - name: Wgraj i zainstaluj na VPS
        run: |
          dir="/root/miecz-deploy/${GITHUB_SHA}"
          ssh vps "mkdir -p '$dir'"
          scp -q paczka_vps/* "vps:$dir/"
          # The install keeps going even if this run is cancelled, and one runs at a time.
          ssh vps "cd '$dir' && nohup flock /root/miecz-deploy.lock env DEBIAN_FRONTEND=noninteractive bash install.sh > '$dir/install.log' 2>&1 < /dev/null & echo \$! > '$dir/pid'"
          for i in $(seq 1 120); do
            sleep 10
            if ssh vps "grep -q '^Gotowe' '$dir/install.log' || ! kill -0 \$(cat '$dir/pid') 2> /dev/null"; then
              break
            fi
          done
          ssh vps "tail -n 25 '$dir/install.log'"
          ssh vps "grep -q '^Gotowe' '$dir/install.log'"

      - name: Sprawdź serwer
        run: |
          sleep 5
          ssh vps "systemctl is-active miecz-dawida && journalctl -u miecz-dawida -n 6 --no-pager"
          # Keep the last three uploads, for a look at their install logs.
          ssh vps "ls -1dt /root/miecz-deploy/*/ | tail -n +4 | xargs -r rm -rf"
